# Local MLflow tracking server and Apache Airflow 3 (LocalExecutor) for the MLOps agent.
# Secrets come from infra/.env (see infra/.env.example). Nothing secret is stored here.
#
#   cd infra && docker compose up -d --build
#   MLflow:  http://localhost:5000      Airflow:  http://localhost:8080

name: mlops-agent

x-airflow-common: &airflow-common
  image: mlops-agent-airflow:local
  build:
    context: .
    dockerfile: airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in infra/.env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?set in infra/.env}@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in infra/.env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_USERNAME:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    # Used by the training DAG and training/train.py
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PROJECT_ROOT: /opt/project
    PYTHONPATH: /opt/project
  volumes:
    - ../dags:/opt/airflow/dags
    - ..:/opt/project
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mlflow:
    image: mlops-agent-mlflow:local
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*" --cors-allowed-origins "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 10

  # Writes the SimpleAuthManager password file onto a shared volume. Runs once as root so
  # the file can be handed to the airflow user (uid 50000).
  airflow-auth-init:
    image: mlops-agent-airflow:local
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        printf '{"%s": "%s"}' "$${AIRFLOW_USERNAME}" "$${AIRFLOW_PASSWORD}" > /opt/airflow/auth/passwords.json
        chown 50000:0 /opt/airflow/auth /opt/airflow/auth/passwords.json
    environment:
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:?set in infra/.env}
    volumes:
      - airflow-auth:/opt/airflow/auth
    user: "0:0"

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
      airflow-auth-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mlflow-data:
  airflow-logs:
  airflow-auth:
